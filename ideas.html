
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>

        :root {
            --blue: #1C7EFF;
            --blue-dark: #0F63D6;
            --blue-light: #0E2548;
            --navy: #18274A;
            --white: #fff;
            --gray: #9DB0D1;
            --line: #22304D;
            --surface: #0B0F18;
            --radius: 14px;
            color-scheme: dark;
            }
            
        .outfit-font {
            font-family: "Outfit", sans-serif;
            font-optical-sizing: auto;
            font-weight: 900;
            font-style: normal;
        }

        
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            text-decoration: none;
        }


        .logo {
            width: 44px;
            height: 44px;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        
        .title b {
            color: var(--blue);
            font-weight: 900;
        }

        body {
            font-family: Outfit, system-ui, sans-serif;
            background: #000000;
            color: var(--white);
            line-height: 1.45;
        }

        h1 {
            font-size: clamp(28px, 4vw, 38px);
            font-weight: 900;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .muted {
            color: var(--gray);
        }

        .app {
            display: grid;
            grid-template-columns: 220px 1fr;
            min-height: 100vh;
        }

        aside {
            border-right: 1px solid var(--line);
            padding: 20px 15px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        main {
            padding: 30px;
            max-width: 1000px;
            width: 100%;
        }


        nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        nav a {
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--gray);
            text-decoration: none;
        }

        nav a:hover {
            background: var(--blue-light);
            color: var(--white);
        }

        nav a.on {
            background: var(--blue);
            color: var(--white);
        }


        a {
            color: inherit;
        }

        .btn {
            display: inline-block;
            background: var(--blue);
            color: var(--white);
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            font: 700 15px Outfit, sans-serif;
            text-decoration: none;
        }

        .idea-row {
            padding: 14px 0;
            border-top: 1px solid var(--line);
        }

        .idea-row:first-child {
            border-top: 0;
            padding-top: 0;
        }

        .idea-row p {
            font-size: 20px;
            font-weight: 700;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(---line);
            border-radius: var(--radius);
            padding: 20px; 
            margin-bottom: 16px;
        }

    </style>
</head>
    
<body>
    <div class="app">
        <aside>
            <a href="index.html" class="brand"><img src="images/logo.png" class="logo"><span class="title">just<b>codebro</b></span></a>
            <nav>
                <a href="dashboard.html" class="on">Dashboard</a>
                <a href="habits.html">Habits</a>
                <a href="analytics.html">Analytics</a>
                <a href="projects.html">Projects</a>
                <a href="ideas.html">Ideas</a>
                <a href="devlog.html">Devlog</a>
                <a href="profile.html">Profile</a>
            </nav>
        </aside>
        <main>
            <h1>Random programming idea</h1>
            <div class="card">
                <div id="ideaBox"></div>
                <button class="btn" id="newIdea" style="margin-top:16px">Generate new Idea</button>
            </div>
        </main>
    </div>
    <script>
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    
        const ideaData = {
            languages: [

                "Rust",
                "Go",
            ],
            themes: {

                    "A rougelike that plays entirely in the terminal",

                    "An idle clicker where the upgrades are important coding concepts",
                ],
                "Productivity": [
                    "A to-do list that hides tasks until their due day",

                    "A focus app that blocks a list of sites for a set time",
                    "A daily planner that auto-schedules tasks around your calendar gaps",
                    "A weekly review page that summarizes what you finshed",
                    "A quick-capture note box that sorts entries into tags on its own", 
                ],
                "Music": [
                    "A drum machine that runs in the browser",
                    "A playlist maker that sortts song by tempo",
                    "A visualizer that draws a song's volume as a city skyline",
                    "A metronome tthat slowly speeds up as you practice",
                    "A chord finder that shows fingerings for any chord name",
                    "A tool that turns a text sentence into a melody",
                    "A practice log that tracks minutes per instrument",
                ],
                "Food": [
                    "A recipe scaler that converts any recipe to your serving size",
                    "A pantry tracker thatt suggests what to cook before food expires",
                    "A random dinner picker with a veto button",
                    "A grocery list that groups items by food category",
                    "A cooking timer that handles several dishes at once",
                    "A meal prep planner that builds a week of lunches from five ingredients",
                    "A unit converter made just for baking"
                ],
                "Space": [
                    "A dashboard showing which satellites pass overhead tonight",
                    "A solar system scale model you can scroll through",
                    "A countdown page for the next rocket launch (or any other significant event)",
                    "A moon phase calendar that draws the moon for any date",
                    "A tool that shows how much you would weigh on every planet",
                    "A star map that shows what's visible from your backyard",
                    "A mission control game where you land a rocket with the keyboard"
                ],
                "Study": [
                    "A flashcard app",
                    "A quiz generator that works from pasted notes",
                    "A tracker for topics you keep forgetting",
                    "A pomodoro timer that tracks study time per subject",
                    "A formula sheet builder you can search and tag",
                    "A reading list that shpws your progress through each book",

                ],
                "Fitness": [

                    "A running pace calculator with split times",
                    "A streak calculator for daily pushups",
                    "A random workout generator based on the equipment you have",
                    "A water intake tracker with a simple animated bottle"
                ],
                "Money": [
                    "A budget tracker that splits spending into categories",
                    "A tool that shows how long it takes to save for a goal",
                    "A bill splitter for group dinners",
                    "A subscription tracker that warns you before renewals",

                ],
                "Art": [
                    "A pixel art editor that exports to PNG",

                    "A drawing app with symmetry mirrors",

                    "An drawing app that you can export to CSS (codeartstudio.vercel.app)"
                ],
                "Weather": [
                    "A minimal weather page that shows only what you should wear",
                    "A tool that compares today's temperature to the same day last year",

                ],
                "Travel": [
                    "A packing list generator based on trip length and climate",

                    "A world map that fills in tthe countries you've visited",

                ],
                "Books": [
                    "A reading tracker that logs pagers per day",
                    "A quote collector that saves your favore lines by book",
                    "A to-read shelf that sorts by how long each book is",

                    "A book club picker that chooses a random title from a shared list"
                ],
                "Home": [
                    "A chore rotation tool for people who share a house",

                    "A maintenance log for things like filter changes and battery swaps",
                    "A shared shopping list that updates for everyone at once",
                    "A tool that tracks when warranties expire"
                ]
            },
            twists: [
                "It only works at night.",
                "Every feature must fit on one screen.",
                "It has to run with no internet.",
                "No external libraries allowed.",
                "It must be controlled with only the keyboard.",
                "Add a secret feature that unlocks after 7 days of use.",

                "The whole interface is a terminal. (if not possible it has to look like one.)",
                "It can ony use three colors.",
                "The entire project must fit in a single file.",
                "It must work well on a phone screen first.",
                "It has to play a sound whenever you finish something.",
                "Add a hidden Easter egg that triggers on a secret key combo.",
                "It can only use one function per feature.",
                "It must be fully usable with your eyes closed.",
                "Every button must be labeled with just an emoji.",
                "It must remember your last session and pick up where you left off.",
                "Write it with no if statements.",
                "It has to look good in both lightt and dark mode.",
                "The app must be under 100 lines of code."


            ]
        };

        const pick = (list) => list[Math.floor(Math.random() * list.length)];
        function makeIdea() {
        const theme = pick(Object.keys(ideaData.themes));
        return { language: pick(ideaData.languages), theme, idea: pick(ideaData.themes[theme]), twist: pick(ideaData.twists) };
        }
        let idea = makeIdea();

        function render () {
            const rows = [
                ["Programming language", idea.language],
                ["Theme", idea.theme],
                ["Idea", idea.idea],
                ["Unecpected twist", idea.twist]
            ];
            $("ideaBox").innerHTML = rows.map(([label, value]) => `<div class="idea-row"><span class="muted">${label}</span><p>${esc(value)}</p></div>`).join("");
        }

        $("newIdea").addEventListener("click", () => { idea = makeIdea(); render(); });
        render();
    </script>

</body>
</html>
