
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>

        :root {
            --blue: #1C7EFF;
            --blue-dark: #0F63D6;
            --blue-light: #0E2548;
            --navy: #18274A;
            --white: #fff;
            --gray: #9DB0D1;
            --line: #22304D;
            --surface: #0B0F18;
            --radius: 14px;
            color-scheme: dark;
            }
            
        .outfit-font {
            font-family: "Outfit", sans-serif;
            font-optical-sizing: auto;
            font-weight: 900;
            font-style: normal;
        }

        
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            text-decoration: none;
        }


        .logo {
            width: 44px;
            height: 44px;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        
        .title b {

            font-weight: 900;
        }

        body {
            font-family: Outfit, system-ui, sans-serif;
            background: #000000;
            color: var(--white);
            line-height: 1.45;
        }

        h1 {
            font-size: clamp(28px, 4vw, 38px);
            font-weight: 900;
            margin-bottom: 20px;
        }

        .app {
            display: grid;
            grid-template-columns: 220px 1fr;
            min-height: 100vh;
        }

        aside {

            padding: 20px 15px;

            top: 0;
            height: 100vh;
        }

        main {
            padding: 28px;
            max-width: 1000px;

        }

        main {

        }


        nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        nav a {
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--gray);
            text-decoration: none;
        }

        nav a:hover {
            background: var(--blue-light);
            color: var(--white);
        }

        nav a.on {
            background: var(--blue);
            color: var(--white);
        }


        a {
            color: inherit;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        input, select, textarea {
            font: 500 15px Outfit, sans-serif;
            background: var(--surface);
            color: var(--white);
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: 11px 14px;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--blue);
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .row input {
            flex: 1;
        }

        .row select {
            width: auto;
        }

    </style>
</head>
    
<body>

        </main>
    </div>

</html>
