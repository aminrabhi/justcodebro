
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>

        :root {
            --blue: #1C7EFF;
            --blue-dark: #0F63D6;
            --blue-light: #0E2548;
            --navy: #18274A;
            --white: #fff;
            --gray: #9DB0D1;
            --line: #22304D;
            --surface: #0B0F18;
            --radius: 14px;
            color-scheme: dark;
            }
            
        .outfit-font {
            font-family: "Outfit", sans-serif;
            font-optical-sizing: auto;
            font-weight: 900;
            font-style: normal;
        }

        
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            text-decoration: none;
        }


        .logo {
            width: 44px;
            height: 44px;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        
        .title b {
            color: var(--blue);
            font-weight: 900;
        }

        body {
            font-family: Outfit, system-ui, sans-serif;
            background: #000000;
            color: var(--white);
            line-height: 1.45;
        }

        .app {
            display: grid;
            grid-template-columns: 220px 1fr;
            min-height: 100vh;
        }

        aside {
            border-right: 1px solid var(--line);
            padding: 20px 15px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        main {
            padding: 30px;
            max-width: 1000px;
            width: 100%;
        }


        nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        nav a {
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--gray);
            text-decoration: none;
        }

        nav a:hover {
            background: var(--blue-light);
            color: var(--white);
        }

        nav a.on {
            background: var(--blue);
            color: var(--white);
        }


        a {
            color: inherit;
        }

        h1 {
            font-size: clamp(28px, 4vw, 38px);
            font-weight: 900;
            margin-bottom: 20px;
        }

        .btn  {
            display: inline-block;
            background: var(--blue);
            color: var(--white);
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            font: 700 15px Outfit, sans-serif;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--blue-dark);
        }


        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        input, select, textarea {
            font: 500px 15px Outfit, sans-serif;
            background: var(--surface);
            color: var(--white);
            border: 1.5px solid var(--line);
            border-radius: 10px;
            padding: 10px 15px;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--blue);
            outline: none;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .field {
            margin-bottom: 20px;
        }

        .row {
            display: flex; 
            gap: 10px;
            align-items: center;
        }

        .row input {
            flex: 1;
        }

        .row select {
            width: auto;
        }


    </style>
</head>
    
<body>
    <div class="app">
        <aside>
            <a href="index.html" class="brand"><img src="images/logo.png" class="logo"><span class="title">just<b>codebro</b></span></a>
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="habits.html">Habits</a>
                <a href="analytics.html">Analytics</a>
                <a href="projects.html">Projects</a>
                <a href="ideas.html">Ideas</a>
                <a href="devlog.html" class="on">Devlog</a>
                <a href="profile.html">Profile</a>
            </nav>
        </aside>
        <main>
            <h1>Devlog</h1>
            <div class="card">
                <div class="field"><label for="entryTitle">Title</label><input id="entryTitle" maxlength="100px"></div>
                <div class="field"><label for="entryBody">Entry</label><input id="entryBody"></div>
                <button class="btn">Save devlog</button>
            </div class="card">
            <div class="card"><div class="entryList"></div></div>
        </main>   
    </div>

    <script>

        const KEY = "justcodebro";
        const defaults = {
            journal: []
        };

        function load() {
            try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
        }

        function save() {
            try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
        }
        let state = { ...defaults, ...load()};

        const $ = (id) => document.getElementById(id);

        function render() {
            $("entryList").innerHTML = [...state.journal].reverse().map((e) => `<div class="item entry">
            <b>${esc(e.title)}</b><span class="muted" style="font-size:13px">${new Date(e.id).toLocaleDateString()}</span>
            <p>${esc(e.body)}</p><button class="link" style="align-self:flex-start" data-do="removeEntry" data-id="${e.id}">Delete</button>
            </div>`).join("") || `<p class="muted">No entries yet.</p>`;
        }

        const actions = {
            addEntry() {
                const title = $("entryTitle").value.trim(), body = $("entryBody").value.trim();
                if (!title && !body) return;
                state.journal.push({ id: Date.now(), title: title || "Untitled entry", body });
                $("entryTitle").value = $("entryBody").value = "";
            },
            removeEntry(id) { state.journal = state.journal.filter((e) => e.id !=id);}
        };

        document.addEventListener("click", (e) => {
            const button = e.target.closest("[data-do]");
            if (!button) return;
            actions[button.data.do](button.dateset.id);
            save(); render();

        }
    );

    render();
    </script>

</body>
</html>
