<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>

        :root {
            --blue: #1C7EFF;
            --blue-dark: #0F63D6;
            --blue-light: #0E2548;
            --navy: #18274A;
            --white: #fff;
            --gray: #9DB0D1;
            --line: #22304D;
            --surface: #0B0F18;
            --radius: 14px;
            color-scheme: dark;
            }
            
        .outfit-font {
            font-family: "Outfit", sans-serif;
            font-optical-sizing: auto;
            font-weight: 900;
            font-style: normal;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding:20px 40px;
        }

        .header .brand {
            margin:0;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            text-decoration: none;
        }


        .logo {
            width: 44px;
            height: 44px;
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        
        .title b {
            color: var(--blue);
            font-weight: 900;
        }

        body {
            font-family: Outfit, system-ui, sans-serif;
            background: #000000;
            color: var(--white);
            line-height: 1.45;
        }

        h1 {
            font-size: clamp(28px, 4vw, 38px);
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        a {
            color: inherit;
        }

        .btn 
        {
            display: inline-block;
            background: var(--blue);
            color: var(--white);
            border: 0;
            border-radius: 10px;
            padding: 11px 18px;
            font: 700 15px Outfit, sans-serif;
            text-decoration: none;
        }
        
        .btn:hover
        {
            background: var(--blue-dark);
        }

        .hero {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 40px;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .hero h1 {
            font-size: 70px;
            line-height: 1.02;
            margin-bottom: 16px;
        }

        .hero h1 b {
            color: var(--blue);
            font-weight: 900;
        }

    </style>
</head>
    
<body>

    <header class="header">
        <a href="index.html" class="brand"><img src="images/logo.png" class="logo"><span class="title">just<b>codebro</b></span></a>
        <a class="btn" href="dashboard.html">Open dashboard</a>
    </header>

    <section class="hero">
        <div>
            <h1>Track your code. <b>Build the habit</b></h1>
        </div>
    </section>

</body>
</html>
